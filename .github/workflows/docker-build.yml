name: Build and Test Weather API

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t weather-api:latest .

      - name: Test health endpoint (without API key)
        run: |
          docker rm -f weather-test || true
          docker run -d -p 5000:5000 --name weather-test weather-api:latest

          for i in {1..10}; do
            if curl -sf http://localhost:5000/health; then
              break
            fi
            sleep 2
          done

          curl -f http://localhost:5000/health || exit 1

      - name: Test home endpoint
        run: curl -f http://localhost:5000/ || exit 1

      - name: Stop test container
        if: always()
        run: |
          docker stop weather-test || true
          docker rm weather-test || true

      - name: Test with API key
        if: ${{ secrets.OPENWEATHER_API_KEY != '' }}
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          docker rm -f weather-test || true
          docker run -d -p 5000:5000 -e OPENWEATHER_API_KEY --name weather-test weather-api:latest

          for i in {1..10}; do
            if curl -sf http://localhost:5000/weather?city=London; then
              break
            fi
            sleep 2
          done

          curl -f "http://localhost:5000/weather?city=London" || exit 1

      - name: Skip API key test
        if: ${{ secrets.OPENWEATHER_API_KEY == '' }}
        run: echo "Skipping /weather API key test because OPENWEATHER_API_KEY secret is not set."

      - name: Success
        run: echo "Build and all tests passed!"
